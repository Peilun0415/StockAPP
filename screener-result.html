<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>篩選結果</title>
  <meta name="theme-color" content="#4b8dff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="狗狗財經">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="icon" type="image/png" href="./icons/app-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/app-icon.png">
  <link rel="stylesheet" href="./styles.css?v=20260706c">
  <script src="./js/viewport-height.js"></script>
</head>
<body class="has-bottom-nav page-screener-result-body">
  <div id="pageLoading" class="page-loading" role="status" aria-live="polite">
    <div class="page-loading-card">
      <img class="page-loading-cat" src="./icons/cat-loading.gif" alt="">
      <p>資料載入中...</p>
    </div>
  </div>
  <main class="page page-screener-result">
    <section class="screener-result">
      <div class="screener-summary-card">
        <div class="screener-summary-head">
          <div class="screener-summary-counts">
            <span class="screener-count-pill">
              <span class="screener-count-label">上市</span>
              <strong id="siiCount">—</strong>
            </span>
            <span class="screener-count-pill">
              <span class="screener-count-label">上櫃</span>
              <strong id="otcCount">—</strong>
            </span>
          </div>
          <p id="dataTitle" class="screener-data-month"></p>
        </div>
        <div id="queryCondition" class="screener-condition-chips"></div>
        <details class="screener-sectors-expand" id="sectorsExpand" hidden>
          <summary class="screener-sectors-summary"></summary>
          <div class="screener-sectors-tags"></div>
        </details>
      </div>

      <div class="search-box screener-search">
        <input id="searchInput" type="search" placeholder="搜尋公司名稱或關鍵字" aria-label="搜尋公司名稱或關鍵字">
      </div>

      <div class="screener-toolbar">
        <div class="pills screener-market-pills">
          <button type="button" class="pill active" data-market="sii">上市</button>
          <button type="button" class="pill" data-market="otc">上櫃</button>
        </div>
        <div class="screener-mark-filters">
          <label class="mark-filter-chip mark-filter-check">
            <input type="checkbox" id="checkbox-check" checked>
            <svg class="ui-icon ui-icon--check" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9.55 16.2 5.25 11.9l1.4-1.425 2.9 2.9 7.05-7.05 1.425 1.4z"/></svg>
            <span>通過</span>
          </label>
          <label class="mark-filter-chip mark-filter-star">
            <input type="checkbox" id="checkbox-star" checked>
            <svg class="ui-icon ui-icon--star" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m12 17.27 4.15 2.49-.99-4.73 3.45-2.98-4.55-.39L12 7.5 9.94 11.66l-4.55.39 3.45 2.98-.99 4.73z"/></svg>
            <span>重點</span>
          </label>
          <label class="mark-filter-chip mark-filter-cross">
            <input type="checkbox" id="checkbox-cross" checked>
            <svg class="ui-icon ui-icon--cross" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.89 18.3 9.18 12 2.89 5.71 4.3 4.3l6.29 6.29 6.29-6.29z"/></svg>
            <span>排除</span>
          </label>
          <label class="mark-filter-chip mark-filter-none">
            <input type="checkbox" id="checkbox-none" checked>
            <span>未標記</span>
          </label>
        </div>
      </div>

      <div class="screener-color-legend" aria-label="列底色規則">
        <span class="screener-legend-title">列底色：</span>
        <span class="screener-legend-item ninety-highlight">月＋年營收 ≥ 90%</span>
        <span class="screener-legend-item sixty-highlight">≥ 60%</span>
        <span class="screener-legend-item thirty-highlight">≥ 30%</span>
        <button type="button" id="colorSortBtn" class="screener-color-sort-btn">依顏色排序</button>
      </div>

      <div class="screener-table-wrap">
        <table id="resultTable-sii" class="screener-table tab-content active">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
        <table id="resultTable-otc" class="screener-table tab-content">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="screenerEmpty" class="screener-empty" hidden>沒有符合條件的股票</p>
    </section>

    <p id="screenerLoadError" class="screener-empty" hidden>篩選資料載入失敗，請稍後再試</p>
  </main>

  <nav class="bottom-nav" aria-label="主要功能切換">
    <div class="bottom-nav-inner">
      <a href="./index.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <path d="M16 3v4M8 3v4M3 11h18"/>
          <path d="M9 15.5h2.5M9 18h5"/>
        </svg>
        <span>除權息</span>
      </a>
      <a href="./screener.html" class="bottom-nav-item is-active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5h16l-6.5 8v5.5L10.5 21v-8L4 5z"/>
        </svg>
        <span>個股篩選</span>
      </a>
      <a href="./profile.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/>
          <path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/>
        </svg>
        <span>帳戶</span>
      </a>
    </div>
  </nav>

  <script>
    window.__MIS_PROXY_ENDPOINT__ = "https://twse-mis-proxy.halloween1456.workers.dev/";
  </script>
  <script type="module" src="./js/screener-result.js"></script>
</body>
</html>
