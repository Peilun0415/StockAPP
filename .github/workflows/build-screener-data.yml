name: Build Screener Data

on:
  schedule:
    # UTC 18:00 Sun–Thu = 台灣時間週一～週五 02:00
    - cron: "0 18 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build screener.json
        run: node scripts/build-screener-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/screener.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update screener data"
            git push
          fi

      - name: Report failure to Firestore
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/report-app-error.mjs "github:build-screener-data" "Build screener data workflow failed"
