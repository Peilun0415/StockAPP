name: Update Stock Master Daily

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC 時區
    # 0 22 * * * = 每天 UTC 22:00 = 台灣時間 (UTC+8) 每天 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update stock master snapshot
        run: node scripts/update-stock-master.mjs

      - name: Commit changes
        run: |
          git add data/stock-master.json
          git diff --staged --quiet || git commit -m "chore: update stock master snapshot"
          git push

