name: Sync TWT48U to Firestore

on:
  schedule:
    # UTC 02:00 Mon–Fri = 台灣時間週一～週五 10:00
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Sync TWT48U to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run sync:corporate

      - name: Report failure to Firestore
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/report-app-error.mjs "github:sync-corporate-actions" "Sync TWT48U workflow failed"
