<body>
  <div id="pageLoading" class="page-loading" role="status" aria-live="polite">
    <div class="page-loading-card">
      <img class="page-loading-cat" src="./icons/cat-loading.gif" alt="">
      <p>資料載入中...</p>
    </div>
  </div>
  <main class="page page-watchlist-edit">
    <header class="detail-head watchlist-edit-head">
      <a href="./index.html" class="back-link" aria-label="返回追蹤清單">
        <span class="back-link-icon" aria-hidden="true">

        <p class="watchlist-edit-hint">長按任一列可拖曳排序；搜尋可新增股票</p>
      </div>
    </header>

    <section class="watchlist-edit-search-section">
      <div class="search-box watchlist-edit-search">
        <input id="keyword" type="search" placeholder="搜尋股號或名稱以加入" aria-label="搜尋股號或名稱以加入追蹤">
        <div id="searchSuggest" class="search-suggest" hidden></div>
      </div>
    </section>

    <ul id="watchlistEditList" class="watchlist-edit-list" aria-label="追蹤股票清單"></ul>
    <p id="watchlistEditEmpty" class="watchlist-edit-empty" hidden>尚無追蹤股，請用上方搜尋加入。</p>
  </main>
  <div id="dragHint" class="drag-hint" hidden>拖曳中，放開即可儲存排序</div>

  <script>
    window.__MIS_PROXY_ENDPOINT__ = "https://twse-mis-proxy.halloween1456.workers.dev/";
