<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>個股詳情</title>
  <meta name="theme-color" content="#4b8dff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="狗狗財經">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="icon" type="image/png" href="./icons/app-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/app-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="pageLoading" class="page-loading" role="status" aria-live="polite">
    <div class="page-loading-card">
      <span class="spinner" aria-hidden="true"></span>
      <p>資料載入中...</p>
    </div>
  </div>
  <main class="page page-detail">
    <header class="detail-head">
      <a href="./index.html" class="back-link" aria-label="返回追蹤清單">◀ 返回</a>
      <div class="detail-id-wrap">
        <p id="detailSymbolTop" class="detail-symbol">--</p>
        <p id="detailNameTop" class="detail-name-top">--</p>
      </div>
      <div class="auth-wrap detail-auth-wrap">
        <img id="authAvatar" class="auth-avatar" alt="使用者頭像" src="" />
        <button id="authBtn" class="login-btn" type="button">
          <span class="auth-btn-label">登出</span>
        </button>
      </div>
    </header>

    <section id="stockSummary" class="stock-summary"></section>

    <div id="pushNotifyRow" class="push-notify-row push-notify-row--detail" hidden>
      <p class="push-notify-text">追蹤股因 TWT48U 新增除權息時通知此裝置。Android 可直接開啟；iOS 請先將本網站「加入主畫面」後再按下方按鈕。</p>
      <div class="push-notify-actions">
        <button type="button" id="pushNotifyBtn" class="push-notify-btn">開啟通知</button>
        <span id="pushNotifyStatus" class="push-notify-status" aria-live="polite"></span>
      </div>
    </div>

    <section class="time-filter">
      <button id="openManualEventBtn" type="button" class="manual-event-btn">+ 新增歷史資訊</button>
      <div class="pills" id="rangePills">
        <button type="button" class="pill active" data-range="1">近 1 年</button>
        <button type="button" class="pill" data-range="3">近 3 年</button>
        <button type="button" class="pill" data-range="5">近 5 年</button>
        <button type="button" class="pill" data-range="all">全部</button>
      </div>
    </section>

    <section>
      <h2 id="historyTitle">歷年除權息紀錄（近 1 年）</h2>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <dialog id="manualEventDialog" class="manual-event-dialog">
    <form id="manualEventForm" method="dialog" class="manual-event-form">
      <h3>新增歷史除權息資料</h3>
      <p class="manual-hint">股票：<span id="manualEventSymbol">--</span></p>
      <label class="manual-checkbox-row" style="display: flex;">
        <input type="checkbox" id="syncRightsWithDividendDate" />
        除權息日期同一天
      </label>
      <label>除息前股價
        <input name="anchorClose" type="number" inputmode="decimal" step="0.0001" min="0" required />
      </label>
      <label>現金股利（元）
        <input name="cashDividend" type="number" inputmode="decimal" step="0.0001" min="0" />
      </label>
      <label>除息日
        <div class="date-segment-field" data-date-name="dividendDate" role="group" aria-label="除息日">
          <div class="date-segment-parts">
            <input type="text" class="date-part date-part-y" maxlength="4" inputmode="numeric" autocomplete="off" aria-label="西元年4碼"  placeholder="YYYY"/>
            <span class="date-slash" aria-hidden="true">/</span>
            <input type="text" class="date-part date-part-m" maxlength="2" inputmode="numeric" autocomplete="off" aria-label="月2碼" placeholder="MM"/>
            <span class="date-slash" aria-hidden="true">/</span>
            <input type="text" class="date-part date-part-d" maxlength="2" inputmode="numeric" autocomplete="off" aria-label="日2碼" placeholder="DD"/>
          </div>
          <input type="hidden" name="dividendDate" value="" />
          <div class="date-cal-slot">
            <button type="button" class="date-cal-btn" tabindex="-1" aria-hidden="true">📅</button>
            <input type="date" class="date-native-pick" aria-label="以日曆選擇除息日" title="日曆選擇" />
          </div>
        </div>
      </label>
      <label>除權前股價
        <input name="rightsAnchorClose" type="number" inputmode="decimal" step="0.0001" min="0" />
      </label>
      <label>股票股利（股）
        <input name="stockDividend" type="number" inputmode="decimal" step="0.0001" min="0" />
      </label>
      <label>除權日
        <div class="date-segment-field" data-date-name="rightsDate" role="group" aria-label="除權日">
          <div class="date-segment-parts">
            <input type="text" class="date-part date-part-y" maxlength="4" inputmode="numeric" autocomplete="off" aria-label="西元年4碼" placeholder="YYYY"/>
            <span class="date-slash" aria-hidden="true">/</span>
            <input type="text" class="date-part date-part-m" maxlength="2" inputmode="numeric" autocomplete="off" aria-label="月2碼" placeholder="MM"/>
            <span class="date-slash" aria-hidden="true">/</span>
            <input type="text" class="date-part date-part-d" maxlength="2" inputmode="numeric" autocomplete="off" aria-label="日2碼" placeholder="DD"/>
          </div>
          <input type="hidden" name="rightsDate" value="" />
          <div class="date-cal-slot">
            <button type="button" class="date-cal-btn" tabindex="-1" aria-hidden="true">📅</button>
            <input type="date" class="date-native-pick" aria-label="以日曆選擇除權日" title="日曆選擇" />
          </div>
        </div>
      </label>
      <div class="manual-actions">
        <button type="button" id="cancelManualEventBtn" class="manual-cancel-btn">取消</button>
        <button type="submit" id="submitManualEventBtn" class="manual-submit-btn">送出寫入</button>
      </div>
    </form>
  </dialog>

  <dialog id="editHistoryDialog" class="manual-event-dialog">
    <form id="editHistoryForm" method="dialog" class="manual-event-form">
      <h3>編輯歷史除權息資料</h3>
      <p class="manual-hint">股票：<span id="editHistorySymbol">--</span></p>
      <input type="hidden" name="originalDate" />
      <input type="hidden" name="originalType" />
      <label>除權息日期
        <div class="date-segment-field" data-date-name="eventDate" role="group" aria-label="除權息日期">
          <div class="date-segment-parts">
            <input type="text" class="date-part date-part-y" maxlength="4" inputmode="numeric" autocomplete="off" aria-label="西元年4碼" />
            <span class="date-slash" aria-hidden="true">/</span>
            <input type="text" class="date-part date-part-m" maxlength="2" inputmode="numeric" autocomplete="off" aria-label="月2碼" />
            <span class="date-slash" aria-hidden="true">/</span>
            <input type="text" class="date-part date-part-d" maxlength="2" inputmode="numeric" autocomplete="off" aria-label="日2碼" />
          </div>
          <input type="hidden" name="eventDate" value="" required />
          <div class="date-cal-slot">
            <button type="button" class="date-cal-btn" tabindex="-1" aria-hidden="true">📅</button>
            <input type="date" class="date-native-pick" aria-label="以日曆選擇除權息日期" title="日曆選擇" />
          </div>
        </div>
      </label>
      <label>除息前股價
        <input name="anchorClose" type="number" inputmode="decimal" step="0.0001" min="0" required />
      </label>
      <label>現金股利（元）
        <input name="cashDividend" type="number" inputmode="decimal" step="0.0001" min="0" />
      </label>
      <label>股票股利（股）
        <input name="stockDividend" type="number" inputmode="decimal" step="0.0001" min="0" />
      </label>
      <div class="manual-actions">
        <button type="button" id="cancelEditHistoryBtn" class="manual-cancel-btn">取消</button>
        <button type="submit" id="submitEditHistoryBtn" class="manual-submit-btn">儲存變更</button>
      </div>
    </form>
  </dialog>

  <script>
    window.__MIS_PROXY_ENDPOINT__ = "https://twse-mis-proxy.halloween1456.workers.dev/";
  </script>
  <script type="module" src="./js/detail.js"></script>
</body>
</html>
