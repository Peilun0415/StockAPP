<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個股詳情</title>
  <meta name="theme-color" content="#4b8dff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="狗狗財經">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="icon" type="image/png" href="./icons/app-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/app-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="pageLoading" class="page-loading" role="status" aria-live="polite">
    <div class="page-loading-card">
      <span class="spinner" aria-hidden="true"></span>
      <p>資料載入中...</p>
    </div>
  </div>
  <main class="page page-detail">
    <header class="detail-head">
      <a href="./index.html" class="back-link" aria-label="返回追蹤清單">◀ 返回</a>
      <div class="detail-id-wrap">
        <p id="detailSymbolTop" class="detail-symbol">--</p>
        <p id="detailNameTop" class="detail-name-top">--</p>
      </div>
      <div class="auth-wrap detail-auth-wrap">
        <img id="authAvatar" class="auth-avatar" alt="使用者頭像" src="" />
        <button id="authBtn" class="login-btn" type="button">
          <span class="google-g" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.45 8.01 1 9.1 1 10.32c0 1.22.45 2.3 1.18 3.2l1.5-1.1z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
          </span>
          <span class="auth-btn-label">Google 登入</span>
        </button>
      </div>
    </header>

    <section id="stockSummary" class="stock-summary"></section>

    <section class="time-filter">
      <button id="openManualEventBtn" type="button" class="manual-event-btn">+ 新增歷史資訊</button>
      <div class="pills" id="rangePills">
        <button type="button" class="pill active" data-range="1">近 1 年</button>
        <button type="button" class="pill" data-range="3">近 3 年</button>
        <button type="button" class="pill" data-range="5">近 5 年</button>
        <button type="button" class="pill" data-range="all">全部</button>
      </div>
    </section>

    <section>
      <h2 id="historyTitle">歷年除權息紀錄（近 1 年）</h2>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <dialog id="manualEventDialog" class="manual-event-dialog">
    <form id="manualEventForm" method="dialog" class="manual-event-form">
      <h3>新增歷史除權息資料</h3>
      <p class="manual-hint">股票：<span id="manualEventSymbol">--</span></p>
      <label>除息前股價
        <input name="anchorClose" type="number" step="0.0001" min="0" required />
      </label>
      <label>現金股利（元）
        <input name="cashDividend" type="number" step="0.0001" min="0" />
      </label>
      <label>除息日
        <input name="dividendDate" type="date" />
      </label>
      <label>股票股利（股）
        <input name="stockDividend" type="number" step="0.0001" min="0" />
      </label>
      <label>除權日
        <input name="rightsDate" type="date" />
      </label>
      <div class="manual-actions">
        <button type="button" id="cancelManualEventBtn" class="manual-cancel-btn">取消</button>
        <button type="submit" id="submitManualEventBtn" class="manual-submit-btn">送出寫入</button>
      </div>
    </form>
  </dialog>

  <dialog id="editHistoryDialog" class="manual-event-dialog">
    <form id="editHistoryForm" method="dialog" class="manual-event-form">
      <h3>編輯歷史除權息資料</h3>
      <p class="manual-hint">股票：<span id="editHistorySymbol">--</span></p>
      <input type="hidden" name="originalDate" />
      <input type="hidden" name="originalType" />
      <label>除權息日期
        <input name="eventDate" type="date" required />
      </label>
      <label>除息前股價
        <input name="anchorClose" type="number" step="0.0001" min="0" required />
      </label>
      <label>現金股利（元）
        <input name="cashDividend" type="number" step="0.0001" min="0" />
      </label>
      <label>股票股利（股）
        <input name="stockDividend" type="number" step="0.0001" min="0" />
      </label>
      <div class="manual-actions">
        <button type="button" id="cancelEditHistoryBtn" class="manual-cancel-btn">取消</button>
        <button type="submit" id="submitEditHistoryBtn" class="manual-submit-btn">儲存變更</button>
      </div>
    </form>
  </dialog>

  <script>
    window.__MIS_PROXY_ENDPOINT__ = "https://twse-mis-proxy.halloween1456.workers.dev/";
  </script>
  <script type="module" src="./js/detail.js"></script>
</body>
</html>
