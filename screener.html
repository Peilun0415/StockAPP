<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>個股篩選</title>
  <meta name="theme-color" content="#4b8dff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="狗狗財經">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="icon" type="image/png" href="./icons/app-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/app-icon.png">
  <link rel="stylesheet" href="./styles.css?v=20260622">
</head>
<body class="has-bottom-nav page-screener-body">
  <div id="pageLoading" class="page-loading" role="status" aria-live="polite">
    <div class="page-loading-card">
      <img class="page-loading-cat" src="./icons/cat-loading.gif" alt="">
      <p>資料載入中...</p>
    </div>
  </div>
  <main class="page page-screener">
    <section class="screener-form-card">
      <h2 class="screener-section-title">條件設定</h2>
      <p id="screenerDataDate" class="screener-data-date"></p>
      <form id="screenerForm" class="screener-form">
        <div class="screener-form-grid">
          <label class="screener-field">
            <span>月營收增加 ≥</span>
            <div class="input-percent">
              <input type="number" name="monthPercent" inputmode="decimal" placeholder="0">
              <span class="percent-sign">%</span>
            </div>
          </label>
          <label class="screener-field">
            <span>年營收增加 ≥</span>
            <div class="input-percent">
              <input type="number" name="yearPercent" inputmode="decimal" placeholder="0">
              <span class="percent-sign">%</span>
            </div>
          </label>
          <label class="screener-field">
            <span>EPS 增加 ≥</span>
            <div class="input-percent">
              <input type="number" name="epsPercent" inputmode="decimal" placeholder="0">
              <span class="percent-sign">%</span>
            </div>
          </label>
        </div>

        <div class="screener-field screener-field-sectors">
          <div class="screener-sector-head">
            <span>類股（可複選）</span>
            <button type="button" id="sectorAllBtn" class="screener-sector-all">全選</button>
          </div>
          <div id="sectorChips" class="screener-sector-chips"></div>
        </div>

        <button type="submit" class="screener-submit-btn">查詢</button>
      </form>
    </section>

    <p id="screenerLoadError" class="screener-empty" hidden>篩選資料載入失敗，請稍後再試</p>
  </main>

  <nav class="bottom-nav" aria-label="主要功能切換">
    <div class="bottom-nav-inner">
      <a href="./index.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <path d="M16 3v4M8 3v4M3 11h18"/>
          <path d="M9 15.5h2.5M9 18h5"/>
        </svg>
        <span>除權息</span>
      </a>
      <a href="./screener.html" class="bottom-nav-item is-active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5h16l-6.5 8v5.5L10.5 21v-8L4 5z"/>
        </svg>
        <span>篩選</span>
      </a>
      <a href="./profile.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/>
          <path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/>
        </svg>
        <span>我的</span>
      </a>
    </div>
  </nav>

  <script type="module" src="./js/screener.js"></script>
</body>
</html>
